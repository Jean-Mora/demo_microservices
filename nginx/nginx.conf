events{}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /users {
            proxy_pass http://users-microservice:8686;
            include /etc/nginx/proxy_headers.conf;
        }

        location /diary {
            proxy_pass http://diary-microservice:8989;
            include /etc/nginx/proxy_headers.conf;
        }

        location = / {
            default_type text/plain;
            return 200 "ESTE ES MI SANDBOX DE ARQUITECTURA EMPRESARIAL. Ve a /users-microservice o a /diary-microservice si quieres ver algo";
        }


    }
}