events{}

http {
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        location /users {
            proxy_pass http://users-microservice:8686;
            include /etc/nginx/proxy_headers.conf;
        }

        location /diary {
            proxy_pass http://diary-microservice:8989;
            include /etc/nginx/proxy_headers.conf;
        }

        # Pagina de bienvenida del sandbox (nginx/html/index.html).
        location = / {
            root /usr/share/nginx/html;
            index index.html;
        }


    }
}